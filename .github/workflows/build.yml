name: Windows build and native smoke tests
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      include_runtime:
        description: '额外构建一份内置 .NET 的 Windows x64 版本'
        type: boolean
        default: false
      release_tag:
        description: '可选：将构建结果上传到已存在的 GitHub Release，例如 v0.1.0'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name == 'release' && github.event.action || github.event_name }}
  cancel-in-progress: true
jobs:
  windows:
    # Stable releases (including promoted pre-releases) use "released".
    # A pre-release published from a draft is delivered as "published".
    if: github.event_name != 'release' || github.event.action == 'released' || github.event.release.prerelease
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check layout model and learning
        run: dotnet run --project tests/LayoutModel -c Release
      - name: Run NeatWin regression tests
        run: dotnet test tests/NeatWin.Tests/NeatWin.Tests.csproj -c Release --logger "console;verbosity=minimal"
      - name: Build WPF
        run: dotnet build src/WinWindow/WinWindow.csproj -c Release
      - name: Publish standalone Windows executables
        shell: pwsh
        env:
          INCLUDE_RUNTIME: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && (inputs.include_runtime || inputs.release_tag != '')) || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-assets]')) }}
        run: ./scripts/package.ps1 -TestNative -IncludeRuntime:($env:INCLUDE_RUNTIME -eq 'true')
      - name: Native window and UI smoke tests from the published executables
        shell: pwsh
        run: |
          $env:WINWINDOW_RECOVERY_FIXTURE = (Resolve-Path 'artifacts/native-x64/Release/AudioFixture.exe').Path
          $executables = @(
            @{ Name = 'standard'; Path = 'artifacts/WinWindow-win-x64.exe' }
          )
          if (Test-Path 'artifacts/WinWindow-win-x64-self-contained.exe') {
            $executables += @{ Name = 'self-contained'; Path = 'artifacts/WinWindow-win-x64-self-contained.exe' }
          }
          foreach ($entry in $executables) {
            $results = Join-Path 'TestResults' $entry.Name
            if (Test-Path $results) { Remove-Item $results -Recurse -Force }
            $exe = (Resolve-Path $entry.Path).Path
            $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', $results) -PassThru
            if (-not $p.WaitForExit(180000)) {
              $log = Join-Path $results 'smoke-tests.txt'
              if (Test-Path $log) { Get-Content $log -Tail 20 }
              $p.Kill($true)
              throw "Packaged desktop tests timed out for $($entry.Name)."
            }
            $log = Join-Path $results 'smoke-tests.txt'
            if (Test-Path $log) { Get-Content $log }
            if ($p.ExitCode -ne 0) { throw "Smoke tests failed for $($entry.Name) ($($p.ExitCode))" }
          }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinWindow-executables-and-tests
          path: |
            artifacts/WinWindow-win-x64.exe
            artifacts/WinWindow-win-x64-self-contained.exe
            artifacts/NoFocusLoss-LICENSE.txt
            artifacts/MinHook-LICENSE.txt
            TestResults/**/*.png
            TestResults/**/smoke-tests.txt
          if-no-files-found: warn
          retention-days: 14

  release-assets:
    needs: windows
    # The marker supports refreshing an existing release's assets after the release event
    # has already fired. Normal pushes never rewrite release downloads.
    if: github.event_name == 'release' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[publish-assets]')) || (github.event_name == 'workflow_dispatch' && inputs.release_tag != '')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WinWindow-executables-and-tests
          path: bundle
      - name: Replace release archives with standalone executables
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || (github.event_name == 'workflow_dispatch' && inputs.release_tag) || 'v0.1.0' }}
          PRERELEASE: ${{ github.event_name == 'release' && github.event.release.prerelease || false }}
        run: |
          assets=(
            bundle/artifacts/WinWindow-win-x64.exe
            bundle/artifacts/NoFocusLoss-LICENSE.txt
            bundle/artifacts/MinHook-LICENSE.txt
          )
          if [[ "$PRERELEASE" == "false" ]]; then
            assets+=(bundle/artifacts/WinWindow-win-x64-self-contained.exe)
          fi
          # Upload the replacement assets before removing old archives so a failed
          # upload never leaves the published release without working downloads.
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" "${assets[@]}"
          for legacy in WinWindow-win-x64.zip WinWindow-win-x64-self-contained.zip; do
            gh release delete-asset --repo "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$legacy" --yes 2>/dev/null || true
          done
