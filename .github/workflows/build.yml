name: Windows build and native smoke tests
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      include_runtime:
        description: '额外构建一份内置 .NET 的 Windows x64 版本'
        type: boolean
        default: false
      release_tag:
        description: '可选：将构建结果上传到已存在的 GitHub Release，例如 v0.1.0'
        type: string
        required: false
        default: ''
permissions:
  contents: read
concurrency:
  group: windows-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]') && github.sha || github.ref }}-${{ github.event_name == 'release' && github.event.action || github.event_name }}
  cancel-in-progress: true
jobs:
  windows:
    # Stable releases (including promoted pre-releases) use "released".
    # A pre-release published from a draft is delivered as "published".
    if: github.event_name != 'release' || github.event.action == 'released' || github.event.release.prerelease
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      CREATE_RELEASE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[publish-release]') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check layout model and learning
        run: dotnet run --project tests/LayoutModel -c Release
      - name: Run NeatWin regression tests
        run: dotnet test tests/NeatWin.Tests/NeatWin.Tests.csproj -c Release --logger "console;verbosity=minimal"
      - name: Build WPF
        run: dotnet build src/WinWindow/WinWindow.csproj -c Release
      # Manual uploads and asset refreshes target existing releases. Resolve the actual
      # release before choosing a package; a manually entered tag may be a prerelease.
      - name: Resolve existing release for asset upload
        id: existing
        if: (github.event_name == 'workflow_dispatch' && inputs.release_tag != '') || (github.event_name == 'push' && github.ref == 'refs/heads/main' && env.CREATE_RELEASE != 'true' && contains(github.event.head_commit.message, '[publish-assets]'))
        uses: actions/github-script@v7
        env:
          INPUT_TAG: ${{ inputs.release_tag }}
        with:
          script: |
            const explicit = (process.env.INPUT_TAG || '').trim();
            if (context.eventName === 'workflow_dispatch' && !explicit) throw new Error('An explicit release tag is required.');
            const version = require('fs').readFileSync('src/WinWindow/WinWindow.csproj', 'utf8')
              .match(/<Version>(\d+\.\d+\.\d+)<\/Version>/)?.[1];
            if (!explicit && !version) throw new Error('A release tag or stable project version is required.');
            const { data: release } = await github.rest.repos.getReleaseByTag({
              ...context.repo, tag: explicit || `v${version}`,
            });
            core.setOutput('tag', release.tag_name);
            core.setOutput('stable', !release.prerelease);
      - name: Publish standalone Windows executables
        id: package
        shell: pwsh
        env:
          INCLUDE_RUNTIME: ${{ env.CREATE_RELEASE == 'true' || (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.include_runtime) || steps.existing.outputs.stable == 'true' }}
        run: |
          ./scripts/package.ps1 -TestNative -IncludeRuntime:($env:INCLUDE_RUNTIME -eq 'true')
          "include_runtime=$($env:INCLUDE_RUNTIME.ToLowerInvariant())" >> $env:GITHUB_OUTPUT
      - name: Native window and UI smoke tests from the published executables
        shell: pwsh
        run: |
          $env:WINWINDOW_RECOVERY_FIXTURE = (Resolve-Path 'artifacts/native-x64/Release/AudioFixture.exe').Path
          $executables = @(
            @{ Name = 'standard'; Path = 'artifacts/WinWindow-win-x64.exe' }
          )
          if (Test-Path 'artifacts/WinWindow-win-x64-self-contained.exe') {
            $executables += @{ Name = 'self-contained'; Path = 'artifacts/WinWindow-win-x64-self-contained.exe' }
          }
          foreach ($entry in $executables) {
            $results = Join-Path 'TestResults' $entry.Name
            if (Test-Path $results) { Remove-Item $results -Recurse -Force }
            $exe = (Resolve-Path $entry.Path).Path
            $p = Start-Process -FilePath $exe -ArgumentList @('--self-test', $results) -PassThru
            if (-not $p.WaitForExit(180000)) {
              $log = Join-Path $results 'smoke-tests.txt'
              if (Test-Path $log) { Get-Content $log -Tail 20 }
              $p.Kill($true)
              throw "Packaged desktop tests timed out for $($entry.Name)."
            }
            $log = Join-Path $results 'smoke-tests.txt'
            if (Test-Path $log) { Get-Content $log }
            if ($p.ExitCode -ne 0) { throw "Smoke tests failed for $($entry.Name) ($($p.ExitCode))" }
          }
      - name: Attach standalone executables to GitHub Release
        if: env.CREATE_RELEASE == 'true' || github.event_name == 'release' || steps.existing.outputs.tag != ''
        uses: actions/github-script@v7
        env:
          RELEASE_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || steps.existing.outputs.tag }}
          INCLUDE_RUNTIME_ASSET: ${{ steps.package.outputs.include_runtime }}
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const createRelease = process.env.CREATE_RELEASE === 'true';
            const version = fs.readFileSync('src/WinWindow/WinWindow.csproj', 'utf8')
              .match(/<Version>(\d+\.\d+\.\d+)<\/Version>/)?.[1];
            if (createRelease && !version) throw new Error('A stable project version is required.');
            const tag = createRelease ? `v${version}` : process.env.RELEASE_TAG;
            if (!tag) throw new Error('No release tag was resolved.');

            const files = [
              { name: 'WinWindow-win-x64.exe', path: 'artifacts/WinWindow-win-x64.exe', contentType: 'application/octet-stream' },
              { name: 'NoFocusLoss-LICENSE.txt', path: 'artifacts/NoFocusLoss-LICENSE.txt', contentType: 'text/plain' },
              { name: 'MinHook-LICENSE.txt', path: 'artifacts/MinHook-LICENSE.txt', contentType: 'text/plain' },
            ];
            if (process.env.INCLUDE_RUNTIME_ASSET === 'true') {
              files.push({
                name: 'WinWindow-win-x64-self-contained.exe',
                path: 'artifacts/WinWindow-win-x64-self-contained.exe',
                contentType: 'application/octet-stream',
              });
            }

            let release;
            if (createRelease) {
              const body = fs.readFileSync(`docs/releases/${tag}.md`, 'utf8');
              const tagRef = await github.rest.git.getRef({ owner, repo, ref: `tags/${tag}` })
                .then(r => r.data, error => { if (error.status !== 404) throw error; return null; });
              const taggedCommit = tagRef?.object.type === 'tag'
                ? (await github.rest.repos.getCommit({ owner, repo, ref: `tags/${tag}` })).data.sha
                : tagRef?.object.sha;
              if (taggedCommit && taggedCommit !== context.sha)
                throw new Error(`${tag} already refers to another commit.`);
              const releases = await github.paginate(github.rest.repos.listReleases, { owner, repo });
              release = releases.find(item => item.tag_name === tag);
              if (release && !release.draft) {
                if (release.prerelease || !taggedCommit || files.some(file => !release.assets.some(
                  asset => asset.name === file.name && asset.state === 'uploaded' && asset.size > 0)))
                  throw new Error(`${tag} already exists with different release contents.`);
                core.info(`${tag} is already published.`);
                return;
              }
              if (release && release.target_commitish !== context.sha && !taggedCommit)
                throw new Error(`The draft for ${tag} targets another commit.`);
              if (!release) {
                ({ data: release } = await github.rest.repos.createRelease({
                  owner, repo, tag_name: tag, target_commitish: context.sha,
                  name: tag, body, draft: true, prerelease: false,
                }));
              }
            } else {
              ({ data: release } = await github.rest.repos.getReleaseByTag({ owner, repo, tag }));
            }

            // Replace same-named assets, then upload the standalone files.
            for (const file of files) {
              const existing = release.assets.find(asset => asset.name === file.name);
              if (existing) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existing.id });
              }
              const data = fs.readFileSync(file.path);
              await github.rest.repos.uploadReleaseAsset({
                owner,
                repo,
                release_id: release.id,
                name: file.name,
                data,
                headers: {
                  'content-type': file.contentType,
                  'content-length': data.length,
                },
              });
              core.info(`Uploaded ${file.name} (${data.length} bytes)`);
            }

            // Only remove legacy ZIP downloads after every replacement upload succeeds.
            for (const legacyName of ['WinWindow-win-x64.zip', 'WinWindow-win-x64-self-contained.zip']) {
              const legacy = release.assets.find(asset => asset.name === legacyName);
              if (legacy) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: legacy.id });
                core.info(`Removed legacy asset ${legacyName}`);
              }
            }

            const body = release.body || '';
            const updatedBody = body
              .replaceAll('WinWindow-win-x64.zip', 'WinWindow-win-x64.exe')
              .replaceAll('WinWindow-win-x64-self-contained.zip', 'WinWindow-win-x64-self-contained.exe');
            if (updatedBody !== body) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body: updatedBody });
            }
            if (createRelease) {
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id,
                draft: false, prerelease: false, make_latest: 'true' });
              core.info(`Published ${tag}.`);
            }
