name: Windows build and native smoke tests
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      include_runtime:
        description: '额外打包一份内置 .NET 的 Windows x64 版本'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name == 'release' && github.event.action || github.event_name }}
  cancel-in-progress: true
jobs:
  windows:
    # Stable releases (including promoted pre-releases) use "released".
    # A pre-release published from a draft is delivered as "published".
    if: github.event_name != 'release' || github.event.action == 'released' || github.event.release.prerelease
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Archive source snapshot
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force artifacts | Out-Null
          git archive --format=zip --output=artifacts/WinWindow-source.zip HEAD
      - name: Build WPF
        run: dotnet build src/WinWindow/WinWindow.csproj -c Release
      - name: Native window and UI smoke tests
        shell: pwsh
        run: |
          $p = Start-Process dotnet -ArgumentList 'src/WinWindow/bin/Release/net10.0-windows/WinWindow.dll --self-test TestResults' -Wait -PassThru
          if (Test-Path TestResults/smoke-tests.txt) { Get-Content TestResults/smoke-tests.txt }
          if ($p.ExitCode -ne 0) { throw "Smoke tests failed ($($p.ExitCode))" }
      - name: Package Windows x64
        shell: pwsh
        env:
          INCLUDE_RUNTIME: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.include_runtime) }}
        run: ./scripts/package.ps1 -IncludeRuntime:($env:INCLUDE_RUNTIME -eq 'true')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinWindow-preview-and-tests
          path: |
            artifacts/*.zip
            TestResults/*.png
            TestResults/smoke-tests.txt
          if-no-files-found: warn
          retention-days: 14

  release-assets:
    needs: windows
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WinWindow-preview-and-tests
          path: bundle
      - name: Attach packages to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          assets=(bundle/artifacts/WinWindow-win-x64.zip)
          if [[ "$PRERELEASE" == "false" ]]; then
            assets+=(bundle/artifacts/WinWindow-win-x64-self-contained.zip)
          fi
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" "${assets[@]}"
