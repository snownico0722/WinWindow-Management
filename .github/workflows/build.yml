name: Windows build and native smoke tests
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  release:
    types: [published, released]
  workflow_dispatch:
    inputs:
      include_runtime:
        description: '额外打包一份内置 .NET 的 Windows x64 版本'
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}-${{ github.event_name == 'release' && github.event.action || github.event_name }}
  cancel-in-progress: true
jobs:
  windows:
    # Stable releases (including promoted pre-releases) use "released".
    # A pre-release published from a draft is delivered as "published".
    if: github.event_name != 'release' || github.event.action == 'released' || github.event.release.prerelease
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Check layout model and learning
        run: dotnet run --project tests/LayoutModel -c Release
      - name: Run NeatWin regression tests
        run: dotnet test tests/NeatWin.Tests/NeatWin.Tests.csproj -c Release --logger "console;verbosity=minimal"
      - name: Build WPF
        run: dotnet build src/WinWindow/WinWindow.csproj -c Release
      - name: Package Windows x64
        shell: pwsh
        env:
          INCLUDE_RUNTIME: ${{ (github.event_name == 'release' && !github.event.release.prerelease) || (github.event_name == 'workflow_dispatch' && inputs.include_runtime) }}
        run: ./scripts/package.ps1 -TestNative -IncludeRuntime:($env:INCLUDE_RUNTIME -eq 'true')
      - name: Native window and UI smoke tests from the published ZIP
        shell: pwsh
        run: |
          $env:WINWINDOW_RECOVERY_FIXTURE = (Resolve-Path 'artifacts/native-x64/Release/AudioFixture.exe').Path
          $testApp = Join-Path $env:RUNNER_TEMP 'WinWindowPackageTest'
          Expand-Archive artifacts/WinWindow-win-x64.zip -DestinationPath $testApp
          $p = Start-Process (Join-Path $testApp 'WinWindow.exe') -ArgumentList '--self-test TestResults' -PassThru
          if (-not $p.WaitForExit(180000)) {
            if (Test-Path TestResults/smoke-tests.txt) { Get-Content TestResults/smoke-tests.txt -Tail 20 }
            $p.Kill($true)
            throw 'Packaged desktop tests timed out. See the last recorded check.'
          }
          if (Test-Path TestResults/smoke-tests.txt) { Get-Content TestResults/smoke-tests.txt }
          if ($p.ExitCode -ne 0) { throw "Smoke tests failed ($($p.ExitCode))" }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: WinWindow-preview-and-tests
          path: |
            artifacts/WinWindow-win-x64.zip
            artifacts/WinWindow-win-x64-self-contained.zip
            TestResults/*.png
            TestResults/smoke-tests.txt
          if-no-files-found: warn
          retention-days: 14

  release-assets:
    needs: windows
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WinWindow-preview-and-tests
          path: bundle
      - name: Attach packages to the published release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          assets=(bundle/artifacts/WinWindow-win-x64.zip)
          if [[ "$PRERELEASE" == "false" ]]; then
            assets+=(bundle/artifacts/WinWindow-win-x64-self-contained.zip)
          fi
          gh release upload --repo "$GITHUB_REPOSITORY" --clobber -- "$RELEASE_TAG" "${assets[@]}"
